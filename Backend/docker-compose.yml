version: '3.8'

# Apply changes: docker compose down && docker compose up --build
# (Migrations run on startup - schema fixes auto-apply to existing DBs)
# If build cache ignores changes: docker compose build --no-cache && docker compose up
# Fresh DB (wipes data): docker compose down -v && docker compose up --build

services:
  backend:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=HealthMobi
      - PRESCRIPTION_AI_URL=http://prescription_extraction:3002
      # Add other environment variables as needed, or use env_file
      # - JWT_SECRET=your_jwt_secret
      # - CLOUDINARY_CLOUD_NAME=...
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  prescription_extraction:
    build:
      context: "../AI Layer/Prescription Extraction Service"
    ports:
      - "3002:3002"
    env_file:
      - "../AI Layer/Prescription Extraction Service/.env"
    restart: unless-stopped

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --lower-case-table-names=1
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=HealthMobi
    volumes:
      - mysql_data:/var/lib/mysql
      # Mount initialization scripts
      # Docker executes files in this directory in alphabetical order
      - ./main.sql:/docker-entrypoint-initdb.d/01-main.sql
      - ./database_optimization.sql:/docker-entrypoint-initdb.d/02-optimization.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  mysql_data:
